name: Feature request
description: A new test family, ABI capability, or improvement
labels: [enhancement]
assignees: [StanislavKozachenko]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool do? For a new adversarial test family, describe the attack and the expected outcome.
    validations:
      required: true
