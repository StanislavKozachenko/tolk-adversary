name: Bug report
description: Something the tool does wrong
labels: [bug]
assignees: [StanislavKozachenko]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the tool did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The command you ran and, if possible, the ABI JSON (or a small contract that produces it).
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: tolk-adversary, Acton and Node.js versions.
      placeholder: 'tolk-adversary 0.0.0, acton 1.2.0, node 24'
    validations:
      required: true
